<!DOCTYPE html>
<html> 
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="lockd.css">
        <link rel="icon" type="image/x-icon" href="C:\Users\heidi\OneDrive - University of Plymouth\comp1004\SPA\Code\LockdFavicon.ico">
        <title>Lockd</title>
    </head>
    <body>
        <section id="allPages">
        <!-- my navigation bar for the application -->
        <nav>
            <div class = "shadow container-fluid"> 
                    <div class = "d-flex bd-highlight">
                        <div class="me-auto p-2 bd-highlight" id="navItem">
                            <button lang="en" type="button" class="button" id="newNoteButton" disabled="true">New Note</button>
                            <button lang="sv" type="button" class="button" id="newNoteButton" disabled="true">Ny Anteckning</button>
                        </div>
                        <div class="ms-auto p-2 bd-highlight" id="navItem">
                            <button lang="en" class="button" type="button" id="settingsButton" onclick="settingsDropdown()">Settings</button>
                            <button lang="sv" class="button" type="button" id="settingsButton" onclick="settingsDropdown()">Inställninghar</button>
                        </div>
                        
                    </div>
            </div>
        </nav>

        
            <div class="order-2 justify-content-center ms-auto" id="settingsBar">
                
                    <h2 lang="en">Settings</h2><h2 lang="sv">Inställninghar</h2>
                <div class="d-flex flex-row">
                <div class="p-2" id="textColumn">
                    <ul>
                        <li lang="en">Theme</li><li lang="sv">Tema</li>
                        <li lang="en">Font Size</li><li lang="sv">Fontstorlek</li>
                        <li lang="en">Language</li><li lang="sv">Språk</li>
                    </ul>
                </div>
                <div class="p-2" id="buttonColumn">
                    <button lang="en" type="button" class="button smallButton" id="themeButton" onclick="themeButton()">Change to Dark</button><button lang="sv" type="button" class="button smallButton" id="themeButton1" onclick="themeButton()">Byt till Mörkt</button>
                    <div class="d-flex justify-content-between">
                        <div class="order-1"><button type="button" class="button smallButton" id="fontButtonDown" onclick="decreaseFontSize()">-</button></div>
                        <div class="order-2"><p lang="en" class="smallText" id="fontSize">Medium</p><p lang="sv" class="smallText" id="fontSize1">Medium</p></div>
                        <div class="order-3"><button type="button" class="button smallButton" id="fontButtonUp" onclick="increaseFontSize()">+</button></div>
                    </div>
                    <button lang="en" type="button" class="button smallButton" id="languageButton" onclick="changeLanguage()">English</button><button lang="sv" type="button" class="button smallButton" id="languageButton1" onclick="changeLanguage()">Svenska</button>
                </div></div>
            </div>
        </div>

    </section>
    <section id="logInSection">
        <div class="order-1 row justify-content-center align-items-center">
            <form id="loginBox">
                <h1 id="logInEn" lang="en">Log in</h1><h1 id="logInSv" lang="sv">Logga in</h1><br>
                <label lang="en" for="username">Username:</label><label lang="sv" for="username"> Användarnamn:</label><br>
                <input type="text" id="username" name="username"><br>
                <label lang="en" for="password">Password:</label><label lang="sv" for="password">Lösenord:</label><br>
                <input type="password" id="password" name="password"><br>
                <button lang="en" type="button" class="button" id="loginButton" onClick="validateLogin()">Log in</button><button lang="sv" type="button" class="button" id="loginButton" onClick="validateLogin()">Logga in</button><br>
                <button lang="en" type="button" class="clickableText" id="signUpText" onClick="signUpPage()">No account? Click here.</button><button lang="sv" type="button" class="clickableText" id="signUpText" onClick="signUpPage()">Inget Konto? Klicka här.</button>
            </form>
        </div>
    </section>

    <section id="signUpSection">
        <div class="order-1 row justify-content-center align-items-center">
            <form id="loginBox">
                <h1 lang="en">Sign Up</h1><h1 id="logInSv" lang="sv">Skapa Konto</h1><br>
                <label lang="en" for="username">Username:</label><label lang="sv" for="username"> Användarnamn:</label><br>
                <input type="text" id="username" name="username"><br>
                <label lang="en" for="password">Password:</label><label lang="sv" for="password">Lösenord:</label><br>
                <input type="password" id="password" name="password"><br>
                <button lang="en" type="button" class="button" id="createAccountButton" onClick="createAccount()">Sign up</button><button lang="sv" type="button" class="button" id="createAccountButton" onClick="createAccount()">Skapa Konto</button><br>
                <button lang="en" type="button" class="clickableText" id="signUpText" onClick="signUpPage()">No account? Click here.</button><button lang="sv" type="button" class="clickableText" id="signUpText" onClick="signUpPage()">Inget Konto? Klicka här.</button>
                <button lang="en" type="button" class="clickableText" id="loginText" onClick="loginPage()">Already have an account? Click here.</button><button lang="sv" type="button" class="clickableText" id="loginText" onClick="loginPage()">Här du redan ett konto? Klicka här.</button>
            </form>
        </div>
    </section>

</html>
