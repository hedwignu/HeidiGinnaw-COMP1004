        <link rel="stylesheet" href="lockd.css">

    <body>
        <!-- my navigation bar for the application -->
        <nav>
            <div class = "shadow container-fluid"> 
                    <div class = "d-flex bd-highlight">
                        <div class="me-auto p-2 bd-highlight" id="navItem">
                            <button type="button" class="button" id="newNoteButton" disabled="true">New Note</button>
                        </div>
                        <div class="ms-auto p-2 bd-highlight" id="navItem">
                            <button class="button" type="button" id="settingsButton" onclick="settingsDropdown()">Settings</button>
                        </div>
                        
                    </div>
            </div>
        </nav>

        
    <div id="main">
            <div class="justify-content-center ms-auto" id="settingsBar">
                
                    <h2>Settings</h2>
                <div class="d-flex flex-row">
                <div class="p-2" id="textColumn">
                    <ul>
                        <li>Theme</li>
                        <li>Font Size</li>
                        <li>Language</li>
                    </ul>
                </div>
                <div class="p-2" id="buttonColumn">
                    <button type="button" class="smallButton" id="themeButton" >Light</button>
                    <button type="button" class="smallButton" id="fontButton" onClick="changeFontSize()">Medium</button>
                    <button type="button" class="smallButton" id="languageButton" onClick="changeLanguage()">English</button>
                </div></div>
            </div>
        </div>

        <div class="row h-100 justify-content-center align-items-center">
            <form id="loginBox">
                <h1>Log in</h1><br>
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username"><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password"><br>
                <button type="button" id="loginButton" onClick="validateLogin()">Log in</button>
                <button type="button" class="clickableText" id="signUpButton" onClick="signUpPage()">No account? Click here.</button>
            </form>
        </div>
    </div>
